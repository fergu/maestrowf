description:
    name: valid_resource_mapping_1
    description: Test variant for verification of valid 'resource mapping' step keys

batch:
    type        : flux
    host        : rzadams
    bank        : guests
    queue       : pdebug
        
env:
    variables:
        OUTPUT_PATH: hello_bye_world
    labels:
        OUT_FORMAT: $(GREETING)_$(NAME).txt

study:
    - name: hello_world
      description: Say hello to someone!
      run:
          cmd: |
            $(LAUNCHER) echo "$(GREETING), $(NAME)!" > $(OUT_FORMAT)
            $(LAUNCHER) sleep 1

          nodes: 1
          procs: 4
          resource mapping:
            allocation:
              tasks: False
            launcher:
              nodes: False
              tasks: True
          nested: True
          exclusive: True       # Testing mixed batch/step
          walltime: "00:60"
          
    - name: bye_world
      description: Say bye to someone!
      run:
          cmd: |
            $(LAUNCHER) echo "Bye, World!" > bye.txt
            $(LAUNCHER) sleep 1
          procs: 1
          nested: True
          exclusive:         # Test overriding launcher from batch block
            allocation: True
            launcher: False     
          walltime: "00:60"
          depends: [hello_world]

global.parameters:
    # NAME:
    #     values: [Pam, Jim, Michael, Dwight]
    #     label: NAME.%%
    # GREETING:
    #     values: [Hello, Ciao, Hey, Hi]
    #     label: GREETING.%%
    NAME:
        values: [Pam]
        label: NAME.%%
    GREETING:
        values: [Hello]
        label: GREETING.%%
