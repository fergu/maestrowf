description:
    name: hello_bye_world_staged
    description: A study that says hello and bye to multiple people along with a non-parameterized staging step.

env:
    variables:
        OUTPUT_PATH: ./sample_output/hello_world
    labels:
        OUT_FORMAT: $(GREETING)_$(NAME).txt

study:
    - name: stage
      description: Dummy un-parameterized input staging step
      run:
        cmd: |
          echo "STAGING ALL THE THINGS"
          echo "This workspace: $(WORKSPACE)"
          
    - name: hello_world
      description: Say hello to someone!
      run:
          cmd: |
            echo "$(GREETING), $(NAME)!" > $(OUT_FORMAT)
            echo "This workspace: $(WORKSPACE)"
            echo "stage workspace: $(stage.workspace)"
            
          depends: [stage]
          
    - name: bye_world
      description: Say bye to someone!
      run:
          cmd: |
            echo "Bye, World!" > bye.txt
            echo "This workspace: $(WORKSPACE)"
            echo "stage workspace: $(stage.workspace)"
            echo "hello_world workspace: $(hello_world.workspace)"
            
          depends: [hello_world]

global.parameters:
    NAME:
        values: [Pam, Jim, Michael, Dwight]
        label: NAME.%%
    GREETING:
        values: [Hello, Ciao, Hey, Hi]
        label: GREETING.%%
